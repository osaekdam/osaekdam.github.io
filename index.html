<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>오색담은 제3회 초대전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
:root{--wall:#F5F4F1;--ink:#16150F;--muted:#8B887E;--hair:#DAD7CF}
@media (prefers-color-scheme:dark){
  :root{--wall:#121210;--ink:#EDEBE4;--muted:#807D74;--hair:#2C2B27}
}
*{box-sizing:border-box}
body{margin:0;background:var(--wall);color:var(--ink);
  font-family:"Noto Serif KR",serif;font-weight:400;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:40px 24px;text-align:center;line-height:1.8}
.k{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;
  color:var(--muted);margin:0 0 26px}
h1{font-weight:500;font-size:clamp(24px,6vw,34px);margin:0;letter-spacing:-.02em;line-height:1.4}
hr{border:0;border-top:1px solid var(--hair);width:64px;margin:30px auto}
p{margin:0;font-size:15px;color:var(--muted)}
</style>
</head>
<body>
<div>
  <p class="k">OSAEKDAM · 3RD INVITATIONAL</p>
  <h1>오색담은 제3회 초대전<br>준비 중입니다</h1>
  <hr>
  <p>2026. 9. 29 — 10. 25 · 안녕475 갤러리</p>
</div>
</body>
</html>
