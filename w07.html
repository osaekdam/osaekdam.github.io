<!doctype html><html lang="ko"><head>
<title>모란도 · 장환비 · 오색담은 제3회 초대전</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<link rel="stylesheet" href="style.css">
</head><body>
<div class="wrap narrow">
  <a class="back mono" href="index.html">← 출품작 목록</a>
  <div class="stage"><img src="img/07_장환비_모란도.jpg" alt="모란도"></div>
  <div class="d-no mono">NO. 07</div>
  <div class="d-title">모란도</div>
  <div class="d-artist">장환비</div>
  <dl class="spec"><div><dt>재료</dt><dd>순지에 분채</dd></div><div><dt>크기</dt><dd>32 × 32 cm</dd></div></dl>
  <div class="audio" id="au" hidden>
    <button class="play" id="pb"><span class="tri" id="ic"></span><span class="lb">음성 해설</span></button>
  </div>
  <div class="bar" id="bar" hidden><div class="fill" id="fill"></div></div>
  <p class="note" id="note"></p>
  <audio id="ak" preload="none" src="audio/07.mp3"></audio>
  <div class="body"><p>모란 꽃송이를 색을 달리해 나란히 놓고, 싱그러운 잎과 봉오리를 사이사이에 더했습니다.</p><p>모란은 부귀를 뜻합니다. 활짝 핀 꽃과 아직 벌어지지 않은 봉오리를 함께 그린 것은, 지금의 좋은 일이 앞으로도 이어지기를 바라는 마음입니다.</p></div>
  <p class="ask">이 작품 구입을 원하시면 갤러리 데스크로 말씀해 주세요.</p>
  <div class="nav"><a href="w06.html">← 화접도(花蝶圖)</a><a href="w08.html">벚꽃과 나비 →</a></div>
  <footer>오색담은 제3회 초대전 · 민화, 오색의 휴식</footer>
</div>
<script>
(function(){
  var a=document.getElementById('ak'), box=document.getElementById('au');
  var b=document.getElementById('pb'), ic=document.getElementById('ic');
  var lb=b.querySelector('.lb'), bar=document.getElementById('bar');
  var fill=document.getElementById('fill'), note=document.getElementById('note');
  a.addEventListener('error',function(){ box.hidden=true; });
  a.addEventListener('loadedmetadata',function(){ box.hidden=false; });
  a.load();
  function state(on){
    lb.textContent=on?'멈추기':'음성 해설';
    ic.className=on?'sq':'tri'; bar.hidden=!on;
  }
  b.onclick=function(){
    if(a.paused){
      a.play().then(function(){ state(true); note.textContent=''; })
       .catch(function(){ note.textContent='재생할 수 없습니다. 화면을 한 번 누른 뒤 다시 시도해 주세요.'; });
    } else { a.pause(); state(false); }
  };
  a.addEventListener('timeupdate',function(){
    if(a.duration) fill.style.width=(a.currentTime/a.duration*100)+'%';
  });
  a.addEventListener('ended',function(){ state(false); fill.style.width='0'; });
  a.addEventListener('pause',function(){ state(false); });
})();
</script>
<script data-goatcounter="https://osaekdam.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body></html>
