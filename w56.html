<!doctype html><html lang="ko"><head>
<title>화조도(맨드라미) · 유미화 · 오색담은 제3회 초대전</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<link rel="stylesheet" href="style.css">
</head><body>
<div class="wrap narrow">
  <a class="back mono" href="index.html">← 출품작 목록</a>
  <div class="stage"><img src="img/w56.jpg" alt="화조도(맨드라미)"></div>
  <div class="d-no mono">NO. 56</div>
  <div class="d-title">화조도(맨드라미)</div>
  
  <div class="d-artist">유미화</div>
  <dl class="spec"><div><dt>재료</dt><dd>순지에 분채</dd></div><div><dt>크기</dt><dd>67.5 × 32 cm</dd></div></dl>
  <div class="audio" id="au" hidden>
    <button class="play" id="pb"><span class="tri" id="ic"></span><span class="lb">음성 해설</span></button>
  </div>
  <div class="bar" id="bar" hidden><div class="fill" id="fill"></div></div>
  <p class="note" id="note"></p>
  <audio id="ak" preload="none" src="audio/56.mp3"></audio>
  <div class="body"><p>붉게 피어난 맨드라미를 가운데 두고 여러 꽃과 나비, 괴석을 함께 놓았습니다.</p><p>풍성하게 오른 맨드라미에 생명력과 번영의 뜻을 담았습니다. 꽃과 나비가 어우러진 모습으로 풍요와 행복을 바랐습니다.</p></div>
  <p class="ask">이 작품 구입을 원하시면 갤러리 데스크로 말씀해 주세요.</p>
  <details class="fix">
    <summary>이 작품의 사진이나 설명을 고치고 싶으신가요</summary>
    <div class="in">
      <input type="text" id="fn" placeholder="성함">
      <textarea id="ft" placeholder="예) 사진을 다시 보내드리겠습니다. 제목이 잘못되었습니다. 설명에서 이 부분을 고쳐주세요."></textarea>
      <button type="button" id="fb">보내기</button>
      <p class="ok" id="fo"></p>
    </div>
  </details>
  <div class="nav"><a href="w55.html">← 화조도(꿩과 매화)</a><a href="w57.html">화람도 →</a></div>
  <footer>오색담은 제3회 초대전 · 민화, 오색의 휴식</footer>
</div>
<script>
(function(){
  var a=document.getElementById('ak'), box=document.getElementById('au');
  var b=document.getElementById('pb'), ic=document.getElementById('ic');
  var lb=b.querySelector('.lb'), bar=document.getElementById('bar');
  var fill=document.getElementById('fill'), note=document.getElementById('note');
  a.addEventListener('error',function(){ box.hidden=true; });
  a.addEventListener('loadedmetadata',function(){ box.hidden=false; });
  a.load();
  function state(on){
    lb.textContent=on?'멈추기':'음성 해설';
    ic.className=on?'sq':'tri'; bar.hidden=!on;
  }
  b.onclick=function(){
    if(a.paused){
      a.play().then(function(){ state(true); note.textContent=''; })
       .catch(function(){ note.textContent='재생할 수 없습니다. 화면을 한 번 누른 뒤 다시 시도해 주세요.'; });
    } else { a.pause(); state(false); }
  };
  a.addEventListener('timeupdate',function(){
    if(a.duration) fill.style.width=(a.currentTime/a.duration*100)+'%';
  });
  a.addEventListener('ended',function(){ state(false); fill.style.width='0'; });
  a.addEventListener('pause',function(){ state(false); });

  var fb=document.getElementById('fb');
  if(fb) fb.onclick=function(){
    var t=document.getElementById('ft').value.trim();
    var o=document.getElementById('fo');
    if(!t){ o.textContent='내용을 적어주세요.'; return; }
    fb.disabled=true; fb.textContent='보내는 중';
    fetch('https://formspree.io/f/mkjgnjrq',{
      method:'POST', headers:{'Accept':'application/json','Content-Type':'application/json'},
      body:JSON.stringify({
        '작품':'56 유미화 · 화조도(맨드라미)',
        '성함':document.getElementById('fn').value.trim()||'(미기재)',
        '내용':t
      })
    }).then(function(r){
      if(!r.ok) throw 0;
      o.textContent='보냈습니다. 고맙습니다.'; fb.textContent='보냈습니다';
    }).catch(function(){
      fb.disabled=false; fb.textContent='보내기';
      o.textContent='보내지 못했습니다. 잠시 후 다시 시도해 주세요.';
    });
  };
})();
</script>
<script data-goatcounter="https://osaekdam.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body></html>
